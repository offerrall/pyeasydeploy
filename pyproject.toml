[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyeasydeploy"
dynamic = ["version"]
authors = [
    {name = "Beltrán Offerrall"}
]
description = "Deploy Python apps to Linux servers over SSH, with plain functions on top of Fabric."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["deployment", "devops", "automation", "ssh", "fabric", "supervisor"]
license = "MIT"

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]

dependencies = [
    "fabric>=3.0.0",
    "pytypehint==1.2.1",
]

[project.urls]
Homepage = "https://github.com/offerrall/pyeasydeploy"
Documentation = "https://offerrall.github.io/pyeasydeploy/"
Repository = "https://github.com/offerrall/pyeasydeploy"
Issues = "https://github.com/offerrall/pyeasydeploy/issues"

[tool.setuptools.dynamic]
version = {attr = "pyeasydeploy.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["pyeasydeploy*"]

[tool.setuptools.package-data]
pyeasydeploy = ["py.typed"]